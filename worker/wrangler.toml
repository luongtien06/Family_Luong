name = "family-luong-sync-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_OWNER = "luongtien06"
GITHUB_REPO = "Family_Luong"
GITHUB_BRANCH = "main"
ALLOWED_ORIGINS = "https://luongtien06.github.io,http://localhost:8088,http://127.0.0.1:8088,http://localhost:5500,http://127.0.0.1:5500"

# Các biến bảo mật sau PHẢI được thiết lập qua lệnh wrangler secret hoặc Cloudflare Dashboard:
# 1. GITHUB_PAT: GitHub Personal Access Token (Fine-grained, Contents: Read and write, Metadata: Read)
# 2. ADMIN_SECRET: Mật khẩu / Khóa bí mật của Quản trị viên
