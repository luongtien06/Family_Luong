<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gia Phả Điện Tử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --paper: #efe5cf;
    --paper-deep: #e2d3a9;
    --paper-line: #d8c793;
    --ink: #241d17;
    --ink-soft: #6e6252;
    --lacquer: #7c1f2c;
    --lacquer-deep: #501019;
    --lacquer-tint: #f7e9ea;
    --gold: #ab8226;
    --gold-soft: #dcb455;
    --gold-tint: #f3e6c2;
    --indigo: #2c4a5e;
    --rose: #8f3349;
    --line: #b79a5e;
    --shadow: 0 10px 28px rgba(36,29,23,0.16);
    --font-display: 'Noto Serif', serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    font-family: var(--font-body);
    background: radial-gradient(circle at 15% 0%, rgba(171,130,38,0.08), transparent 45%), var(--paper);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }

  header{
    position: relative;
    background: linear-gradient(180deg, var(--lacquer) 0%, var(--lacquer-deep) 100%);
    color: var(--gold-tint);
    text-align: center;
    padding: 30px 16px 26px;
    border-bottom: 4px solid var(--gold);
    box-shadow: var(--shadow);
  }
  header h1{ font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 5vw, 30px);}
  header p{ font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-soft); margin-top: 6px;}

  .toolbar-wrap{
    position: sticky; top: 0; z-index: 60;
    background: var(--paper-deep);
    border-bottom: 1px solid var(--paper-line);
    box-shadow: 0 4px 14px rgba(36,29,23,0.08);
  }
  .controls{
    display:flex; gap:8px; justify-content:center; align-items:center;
    flex-wrap: wrap; padding: 10px 12px; max-width: 1100px; margin: 0 auto;
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding: 9px 14px; border:1px solid transparent;
    border-radius: 999px; cursor:pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    white-space: nowrap; background: #fff; color: var(--ink);
  }
  .btn:active{ transform: scale(0.96); }
  .btn .ic{ font-size: 15px; line-height:1; }
  .btn-add{ background: var(--lacquer); color:#fff; }
  .btn-export{ background: var(--indigo); color:#fff; }
  .btn-import{ background: var(--gold); color:#fff; cursor: pointer; }
  /* hide native file input, use styled label instead */
  input[type="file"]{ display:none; }
  .btn-clear{ background:#fff; color: var(--lacquer); border-color: var(--lacquer); cursor:pointer; }
  .btn-login{ background: var(--ink); color:#fff; }
  .btn-logout{ background:#7a2020; color:#fff; }

  /* Mặc định ẩn nút thao tác khi chưa đăng nhập */
  .admin-only { display: none !important; }

  .sync-status{ text-align:center; font-family: var(--font-mono); font-size: 11px; padding: 0 12px 10px; min-height: 14px; color: var(--ink-soft); }
  .sync-status.syncing{ color: var(--gold); }
  .sync-status.ok{ color:#2e7d32; }
  .sync-status.error{ color:#b3261e; }

  .zoom-group{ display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--paper-line); border-radius: 999px; padding: 3px; }
  .zoom-btn{ width:30px; height:30px; border:none; border-radius:50%; background:transparent; font-size:16px; font-weight:700; cursor:pointer; }
  .zoom-label{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 42px; text-align:center; }

  .legend{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; padding: 6px 12px 10px; font-size: 12px; color: var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot.male{ background: var(--indigo); }
  .dot.female{ background: var(--rose); }
  .dot.living{ background: var(--gold); }
  .dot.deceased{ background: var(--ink-soft); }

  .tree-area{ padding: 34px 10px 60px; overflow: auto; min-height: 55vh; text-align:center; }
  .zoom-fit{ display:inline-block; transform-origin: top center; transition: transform .18s ease; text-align:center; }

  /* Organization Tree CSS */
  .tree ul{ padding-top: 26px; position: relative; width: max-content; }
  .tree > ul{ display:inline-block; padding-top:0; }
  .tree ul::after{ content:''; display:table; clear:both; }
  .tree li{ float:left; text-align:center; list-style:none; position:relative; padding: 26px 10px 0 10px; }
  .tree li::before, .tree li::after{ content:''; position:absolute; top:0; right:50%; border-top: 2px solid var(--line); width:50%; height:26px; }
  .tree li::after{ right:auto; left:50%; border-left: 2px solid var(--line); }
  .tree li:only-child::after, .tree li:only-child::before{ display:none; }
  .tree li:only-child{ padding-top:0; }
  .tree li:first-child::before, .tree li:last-child::after{ border:0 none; }
  .tree li:last-child::before{ border-right: 2px solid var(--line); border-radius: 0 6px 0 0; }
  .tree li:first-child::after{ border-radius: 6px 0 0 0; }
  .tree ul ul::before{ content:''; position:absolute; top:0; left:50%; border-left: 2px solid var(--line); width:0; height:26px; }

  .node-card{
    display:inline-block; background:#fffdf8; border: 1px solid var(--paper-line);
    border-top: none; border-radius: 4px 4px 12px 12px; padding: 20px 18px 14px;
    min-width: 168px; max-width: 190px; text-align:center; cursor:pointer; position:relative;
    box-shadow: 0 4px 12px rgba(36,29,23,0.10); transition: transform .16s ease;
  }
  .node-card:hover{ transform: translateY(-3px); }
  .node-card::before{
    content:''; position:absolute; top:-9px; left:50%; transform: translateX(-50%);
    border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 9px solid var(--gold);
  }
  .node-card.male{ border-top: 3px solid var(--indigo); }
  .node-card.male::before{ border-bottom-color: var(--indigo); }
  .node-card.female{ border-top: 3px solid var(--rose); }
  .node-card.female::before{ border-bottom-color: var(--rose); }
  .node-avatar{
    width:48px; height:48px; border-radius:50%; margin: 0 auto 8px;
    background-size:cover; background-position:center; background-color: var(--paper-deep);
    border:2px solid var(--paper-line);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color: var(--ink-soft);
  }
  .node-card.male .node-avatar{ border-color: var(--indigo); }
  .node-card.female .node-avatar{ border-color: var(--rose); }
  .node-eyebrow{ font-family: var(--font-mono); font-size: 10px; color: var(--gold); text-transform: uppercase; }
  .node-name{ font-family: var(--font-display); font-weight: 700; font-size: 15px; }
  .node-years, .node-spouse{ font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .node-occupation{ font-size: 11px; color: var(--ink-soft); font-style: italic; margin-top: 3px; }
  .node-status{
    display:inline-flex; align-items:center; gap:4px;
    margin-top: 8px; font-size: 10px; font-weight:600;
    padding: 2px 8px; border-radius: 999px;
  }
  .node-status.living{ background: var(--gold-tint); color:#7a5c14; }
  .node-status.deceased{ background:#eceae4; color: var(--ink-soft); }
  .node-status .dot{ width:6px; height:6px; }

  .modal-overlay{ display:none; position: fixed; inset:0; background: rgba(36,29,23,0.55); justify-content:center; align-items:center; z-index:100; padding: 16px; }
  .modal-box{ background:#fffdf8; border-radius: 16px; width:100%; max-width: 440px; padding: 26px 24px; max-height: 88vh; overflow-y:auto; border-top: 5px solid var(--lacquer); }
  .modal-box h2{ font-family: var(--font-display); color: var(--lacquer); margin-bottom: 18px; font-size: 20px; }
  .form-group{ margin-bottom: 14px; }
  .form-group label{ display:block; font-size:12.5px; font-weight:600; color: var(--ink-soft); margin-bottom:5px; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea{ width:100%; padding: 10px 12px; border:1px solid var(--paper-line); border-radius: 8px; font-size:14px; background: #fbf7ee; }
  .form-row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  .modal-note{ font-size:12px; color: var(--ink-soft); margin-bottom: 12px; }
  .error-text{ color: #b3261e; font-size: 12px; margin-bottom: 10px; }
  .btn-save{ background: var(--lacquer); color:#fff; }
  .btn-cancel{ background:#efe9db; color: var(--ink); }
  .btn-delete{ background:#fff; color:#b3261e; border:1px solid #b3261e; }

  .empty-state{ text-align:center; padding: 70px 20px; color: var(--ink-soft); }

  .photo-upload-row{ display:flex; align-items:center; gap:14px; }
  .photo-preview{
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    background-size:cover; background-position:center; background-color: var(--paper-deep);
    border:2px solid var(--paper-line);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; color: var(--ink-soft);
  }
  .photo-upload-actions{ display:flex; flex-direction:column; gap:6px; }
  .photo-upload-actions .btn{ padding:7px 12px; font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>Gia Phả Điện Tử</h1>
  <p>Lưu giữ dòng dõi gia đình</p>
</header>

<div class="toolbar-wrap">
  <div class="controls">
    <button class="btn btn-add admin-only" onclick="openAddModal()"><span class="ic">➕</span><span class="label">Thêm tổ tiên</span></button>
    <button class="btn btn-export" onclick="exportData()"><span class="ic">💾</span><span class="label">Xuất file</span></button>
    <label class="btn btn-import admin-only">
      <span class="ic">📁</span><span class="label">Nhập file</span>
      <input type="file" id="fileInput" accept=".json" onchange="importData(this)">
    </label>
    <button class="btn btn-clear admin-only" onclick="clearAll()"><span class="ic">🗑️</span><span class="label">Xóa hết</span></button>
    
    <button class="btn btn-login" id="btnLogin" onclick="openLoginModal()"><span class="ic">🔑</span><span class="label">Đăng nhập</span></button>
    <button class="btn btn-logout admin-only" id="btnLogout" onclick="logout()"><span class="ic">🚪</span><span class="label">Đăng xuất</span></button>

    <div class="zoom-group">
      <button class="zoom-btn" onclick="zoomTree(-0.1)">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="zoom-btn" onclick="zoomTree(0.1)">+</button>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot male"></i>Nam</span>
    <span><i class="dot female"></i>Nữ</span>
    <span><i class="dot living"></i>Còn sống</span>
    <span><i class="dot deceased"></i>Đã khuất</span>
  </div>
  <div id="syncStatus" class="sync-status"></div>
</div>

<div class="tree-area">
  <div class="zoom-fit" id="zoomFit">
    <div id="treeRoot" class="tree"></div>
  </div>
</div>

<!-- MODAL LOGIN ADMIN -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h2>Cấu hình Admin (GitHub Sync)</h2>
    <p class="modal-note">Nhập Personal Access Token GitHub của bạn để kích hoạt quyền.</p>
    <div class="form-group">
      <label>GitHub Personal Access Token</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>GitHub Owner</label>
        <input type="text" id="ghOwner" placeholder="...">
      </div>
      <div class="form-group">
        <label>GitHub Repository</label>
        <input type="text" id="ghRepo" placeholder="...">
      </div>
    </div>
    <p id="loginError" class="error-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeLoginModal()">Hủy</button>
      <button class="btn btn-save" onclick="loginAdmin()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- MODAL ADD/EDIT MEMBER -->
<div class="modal-overlay" id="memberModal">
  <div class="modal-box">
    <h2 id="modalTitle">Thêm thành viên</h2>
    <div class="form-group">
      <label>Họ và tên *</label>
      <input type="text" id="mName" placeholder="...">
    </div>
    <div class="form-group">
      <label>Ảnh đại diện</label>
      <div class="photo-upload-row">
        <div id="mPhotoPreview" class="photo-preview">👤</div>
        <div class="photo-upload-actions">
          <label class="btn btn-import" style="cursor:pointer;">
            <span class="ic">📷</span><span class="label">Chọn ảnh</span>
            <input type="file" id="mPhotoInput" accept="image/*" onchange="handlePhotoSelect(this)">
          </label>
          <button type="button" class="btn btn-cancel" id="btnRemovePhoto" onclick="removePhoto()" style="display:none;">Xóa ảnh</button>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Giới tính</label>
        <select id="mGender">
          <option value="male">Nam</option>
          <option value="female">Nữ</option>
        </select>
      </div>
      <div class="form-group">
        <label>Thế hệ thứ</label>
        <input type="number" id="mGeneration" placeholder="1" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Năm sinh</label>
        <input type="text" id="mDob" placeholder="...">
      </div>
      <div class="form-group">
        <label>Năm mất</label>
        <input type="text" id="mDod" placeholder="Để trống nếu còn sống">
      </div>
    </div>
    <div class="form-group">
      <label>Vợ / Chồng</label>
      <input type="text" id="mSpouse" placeholder="...">
    </div>
    <div class="form-group">
      <label>Nghề nghiệp</label>
      <input type="text" id="mOccupation" placeholder="...">
    </div>
    <div class="form-group">
      <label>Ghi chú</label>
      <textarea id="mNote" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Cha / Mẹ</label>
      <select id="mParentId"><option value="">-- Tổ tiên --</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn btn-delete admin-only" id="btnDelete" onclick="deleteMember()">Xóa</button>
      <button class="btn btn-save" onclick="saveMember()">Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL VIEW DETAIL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <h2 id="dName"></h2>
    <div id="dContent" class="detail-content"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeDetail()">Đóng</button>
      <button class="btn btn-add admin-only" onclick="editFromDetail()">Sửa</button>
      <button class="btn btn-add admin-only" onclick="addChildFromDetail()">Thêm con</button>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // KHỞI TẠO BIẾN CẤU HÌNH & TRẠNG THÁI
  // ==========================================
  let members = [];
  let nextId = 1;
  let editingId = null;
  let detailId = null;
  let zoomLevel = 1;
  let fileSha = null;
  let currentPhotoData = ''; // ảnh (base64, đã nén) đang chọn trong form thêm/sửa

  // Lấy cấu hình Admin từ sessionStorage (tự động đăng xuất khi đóng trình duyệt)
  let ghConfig = JSON.parse(sessionStorage.getItem('ghAdminConfig')) || null;

  // Tự động chạy khi ứng dụng được tải
  async function init() {
    checkAuthUI();
    await loadData();
    renderTree();
  }

  // ==========================================
  // XÁC THỰC VÀ PHÂN QUYỀN (AUTH & PERMISSION)
  // ==========================================
  function checkAuthUI() {
    const adminElements = document.querySelectorAll('.admin-only');
    const loginBtn = document.getElementById('btnLogin');
    
    if (isAdmin()) {
      adminElements.forEach(el => el.classList.remove('admin-only'));
      if (loginBtn) loginBtn.style.display = 'none';
    } else {
      adminElements.forEach(el => el.classList.add('admin-only'));
      if (loginBtn) loginBtn.style.display = 'inline-flex';
    }
  }

  function isAdmin() {
    return !!(ghConfig && ghConfig.token && ghConfig.owner && ghConfig.repo);
  }

  function openLoginModal() {
    document.getElementById('ghToken').value = ghConfig?.token || '';
    document.getElementById('ghOwner').value = ghConfig?.owner || '';
    document.getElementById('ghRepo').value = ghConfig?.repo || '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginModal').style.display = 'flex';
  }

  function closeLoginModal() { 
    document.getElementById('loginModal').style.display = 'none'; 
  }

  function loginAdmin() {
    const token = document.getElementById('ghToken').value.trim();
    const owner = document.getElementById('ghOwner').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();

    if (!token || !owner || !repo) {
      document.getElementById('loginError').textContent = 'Vui lòng nhập đủ thông tin!';
      return;
    }

    ghConfig = { token, owner, repo };
    // Lưu vào sessionStorage để khi đóng tab/trình duyệt sẽ tự đăng xuất
    sessionStorage.setItem('ghAdminConfig', JSON.stringify(ghConfig));
    checkAuthUI();
    closeLoginModal();
    saveData();
  }

function logout() {
  ghConfig = null;
  sessionStorage.removeItem('ghAdminConfig');
  
  // 1. Cập nhật lại giao diện ngay lập tức (ẩn nút Admin, hiện nút Login)
  checkAuthUI(); 
  
  // 2. Render lại cây ngay lập tức để ẩn các nút thao tác trên từng thẻ (nếu có)
  renderTree(); 
  
  // 3. Tải lại dữ liệu gốc từ server/GitHub ở chế độ ngầm để xóa dữ liệu tạm chưa sync (nếu có)
  loadData().then(() => {
    renderTree();
  });
}

  // ==========================================
  // ĐỒNG BỘ DỮ LIỆU (DATA SYNC & API)
  // ==========================================
  function setSyncStatus(state, msg) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    if (state === 'syncing') { el.textContent = '🔄 ' + msg; el.className = 'sync-status syncing'; }
    else if (state === 'ok') { el.textContent = '✅ ' + msg; el.className = 'sync-status ok'; }
    else if (state === 'error') { el.textContent = '⚠️ ' + msg; el.className = 'sync-status error'; }
  }

  function utf8ToBase64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
  }

  async function loadData() {
    setSyncStatus('syncing', 'Đang tải dữ liệu...');
    
    // 1. Đọc cache từ localStorage (giúp Admin thấy dữ liệu ngay cả khi F5 lúc GitHub đang build)
    const localTemp = localStorage.getItem('temp_family_data');
    if (localTemp) {
      try {
        const data = JSON.parse(localTemp);
        members = data.members || [];
        nextId = data.nextId || 1;
      } catch(e) { console.error('Cache error:', e); }
    }

    // 2. Fetch dữ liệu mới nhất từ GitHub Pages
    try {
      const res = await fetch(`data.json?t=${new Date().getTime()}`, { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        members = data.members || [];
        nextId = data.nextId || 1;
        
        // Cập nhật lại cache đồng bộ
        localStorage.setItem('temp_family_data', JSON.stringify({ members, nextId }));
        setSyncStatus('ok', 'Đã tải dữ liệu mới nhất');
      } else {
        if (!localTemp) setSyncStatus('ok', 'Khởi tạo cây gia phả mới');
      }
    } catch (e) {
      if (localTemp) {
        setSyncStatus('ok', 'Đang hiển thị dữ liệu từ bộ nhớ tạm');
      } else {
        setSyncStatus('error', 'Không đọc được file data.json');
      }
    }
  }

  async function saveData() {
    if (!isAdmin()) {
      alert('Bạn không có quyền thực hiện thao tác này!');
      return;
    }
    setSyncStatus('syncing', 'Đang lưu vào GitHub...');

    // Lưu ngay vào localStorage bộ nhớ tạm
    localStorage.setItem('temp_family_data', JSON.stringify({ members, nextId }));

    try {
      const getUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/data.json`;
      
      const getRes = await fetch(getUrl, {
        headers: { 
          'Authorization': `Bearer ${ghConfig.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (getRes.ok) {
        const fileInfo = await getRes.json();
        fileSha = fileInfo.sha;
      }

      const payload = JSON.stringify({ members, nextId }, null, 2);
      const contentBase64 = utf8ToBase64(payload);

      const putRes = await fetch(getUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${ghConfig.token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: 'Cập nhật gia phả từ Admin',
          content: contentBase64,
          sha: fileSha || undefined
        })
      });

      if (putRes.ok) {
        const resData = await putRes.json();
        fileSha = resData.content.sha; // Cập nhật SHA mới nhất
        setSyncStatus('ok', 'Đã lưu thành công!');
      } else {
        const err = await putRes.json();
        throw new Error(err.message || 'Lỗi ghi đè file');
      }
    } catch (e) {
      setSyncStatus('error', 'Lỗi lưu dữ liệu: ' + e.message);
      alert('Lỗi lưu GitHub: ' + e.message);
    }
  }

  // ==========================================
  // RENDER CÂY GIA PHẢ (TREE RENDERING)
  // ==========================================
  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV', 'XXV'];

  function renderTree() {
    const root = document.getElementById('treeRoot');
    root.innerHTML = '';
    
    // Tìm các gốc (không có parentId)
    const roots = members.filter(m => m.parentId === null || m.parentId === undefined || m.parentId === "");
    
    if (roots.length === 0) {
      root.innerHTML = `<div class="empty-state"><p>Chưa có dữ liệu gia phả. Hãy "Thêm tổ tiên".</p></div>`;
      return;
    }

    const ul = document.createElement('ul');
    roots.forEach(r => ul.appendChild(buildNodeLi(r)));
    root.appendChild(ul);
  }

  function buildNodeLi(member) {
    const li = document.createElement('li');
    li.appendChild(buildCard(member));
    
    const children = members.filter(m => m.parentId === member.id);
    if (children.length > 0) {
      const childUl = document.createElement('ul');
      children.forEach(c => childUl.appendChild(buildNodeLi(c)));
      li.appendChild(childUl);
    }
    return li;
  }

  function buildCard(m) {
    const card = document.createElement('div');
    card.className = `node-card ${m.gender}`;
    card.onclick = () => openDetail(m.id);
    
    const genDisplay = ROMAN[m.generation] || m.generation;
    const isDeceased = !!(m.dod && String(m.dod).trim());
    const avatarHtml = m.photo
      ? `<div class="node-avatar" style="background-image:url('${m.photo}')"></div>`
      : `<div class="node-avatar">👤</div>`;
    card.innerHTML = `
      ${avatarHtml}
      <div class="node-eyebrow">Đời ${genDisplay}</div>
      <div class="node-name">${escapeHTML(m.name)}</div>
      <div class="node-years">${escapeHTML(m.dob || '?')} - ${escapeHTML(m.dod || 'nay')}</div>
      ${m.occupation ? `<div class="node-occupation">${escapeHTML(m.occupation)}</div>` : ''}
      ${m.spouse ? `<div class="node-spouse">♥ ${escapeHTML(m.spouse)}</div>` : ''}
      <div class="node-status ${isDeceased ? 'deceased' : 'living'}">
        <i class="dot ${isDeceased ? 'deceased' : 'living'}"></i>${isDeceased ? 'Đã khuất' : 'Còn sống'}
      </div>
    `;
    return card;
  }

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }

  // ==========================================
  // ẢNH ĐẠI DIỆN (CHỌN / NÉN / XÓA)
  // ==========================================
  function updatePhotoPreview(dataUrl) {
    const el = document.getElementById('mPhotoPreview');
    const removeBtn = document.getElementById('btnRemovePhoto');
    if (dataUrl) {
      el.style.backgroundImage = `url(${dataUrl})`;
      el.textContent = '';
      removeBtn.style.display = 'inline-flex';
    } else {
      el.style.backgroundImage = '';
      el.textContent = '👤';
      removeBtn.style.display = 'none';
    }
  }

  function handlePhotoSelect(input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      alert('Vui lòng chọn một tệp hình ảnh.');
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Resize + nén ảnh để không làm phình to file data.json
        const MAX_SIZE = 240;
        let { width, height } = img;
        if (width > height) {
          if (width > MAX_SIZE) { height = Math.round(height * (MAX_SIZE / width)); width = MAX_SIZE; }
        } else {
          if (height > MAX_SIZE) { width = Math.round(width * (MAX_SIZE / height)); height = MAX_SIZE; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        currentPhotoData = canvas.toDataURL('image/jpeg', 0.75);
        updatePhotoPreview(currentPhotoData);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    input.value = '';
  }

  function removePhoto() {
    currentPhotoData = '';
    updatePhotoPreview('');
  }

  // ==========================================
  // THAO TÁC THÊM / SỬA / XÓA THÀNH VIÊN
  // ==========================================
  function updateParentSelect(excludeId = null) {
    const select = document.getElementById('mParentId');
    select.innerHTML = '<option value="">-- Tổ tiên (Gốc) --</option>';
    
    members.forEach(m => {
      if (m.id !== excludeId) {
        select.innerHTML += `<option value="${m.id}">${escapeHTML(m.name)} (Đời ${m.generation})</option>`;
      }
    });
  }

  // Tự động gợi ý Thế hệ dựa theo Cha/Mẹ được chọn
  function handleParentChange() {
    const parentId = document.getElementById('mParentId').value;
    const genInput = document.getElementById('mGeneration');
    
    if (parentId) {
      const parent = members.find(m => m.id === parseInt(parentId));
      if (parent) {
        genInput.value = (parseInt(parent.generation) || 1) + 1;
      }
    } else {
      if (!editingId) genInput.value = 1;
    }
  }

  function openAddModal() {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền thực hiện!"); return; }
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Thêm thành viên';
    document.getElementById('mName').value = '';
    document.getElementById('mGender').value = 'male';
    document.getElementById('mGeneration').value = '1';
    document.getElementById('mDob').value = '';
    document.getElementById('mDod').value = '';
    document.getElementById('mSpouse').value = '';
    document.getElementById('mOccupation').value = '';
    document.getElementById('mNote').value = '';
    document.getElementById('btnDelete').style.display = 'none';
    currentPhotoData = '';
    updatePhotoPreview('');
    
    updateParentSelect();
    document.getElementById('mParentId').onchange = handleParentChange;
    document.getElementById('memberModal').style.display = 'flex';
  }

  function closeModal() { 
    document.getElementById('memberModal').style.display = 'none'; 
  }

  function saveMember() {
    if (!isAdmin()) return;
    
    const name = document.getElementById('mName').value.trim();
    if (!name) return alert('Vui lòng nhập Họ và tên!');
    
    const gender = document.getElementById('mGender').value;
    const generation = parseInt(document.getElementById('mGeneration').value) || 1;
    const dob = document.getElementById('mDob').value.trim();
    const dod = document.getElementById('mDod').value.trim();
    const spouse = document.getElementById('mSpouse').value.trim();
    const occupation = document.getElementById('mOccupation').value.trim();
    const note = document.getElementById('mNote').value.trim();
    const pVal = document.getElementById('mParentId').value;
    const parentId = pVal ? parseInt(pVal) : null;

    if (editingId) {
      let m = members.find(x => x.id === editingId);
      if (m) {
        Object.assign(m, { name, gender, generation, dob, dod, spouse, occupation, note, parentId, photo: currentPhotoData });
      }
    } else {
      members.push({
        id: nextId++,
        name, gender, generation, dob, dod, spouse, occupation, note, parentId, photo: currentPhotoData
      });
    }
    
    renderTree();
    closeModal();
    saveData();
  }

  function deleteMember() {
    if (!isAdmin()) return;
    if (!editingId || !confirm('CẢNH BÁO: Xóa người này sẽ xóa toàn bộ con cháu của họ. Bạn có chắc chắn?')) return;
    
    function removeBranch(id) {
      const kids = members.filter(m => m.parentId === id).map(m => m.id);
      members = members.filter(m => m.id !== id);
      kids.forEach(removeBranch);
    }
    
    removeBranch(editingId);
    renderTree();
    closeModal();
    saveData();
  }

  // ==========================================
  // CHI TIẾT VÀ BẢNG THÔNG TIN (DETAIL MODAL)
  // ==========================================
  function openDetail(id) {
    detailId = id;
    const m = members.find(x => x.id === id);
    if (!m) return;

    document.getElementById('dName').textContent = m.name;
    const isDeceased = !!(m.dod && String(m.dod).trim());
    const photoHtml = m.photo
      ? `<img src="${m.photo}" alt="${escapeHTML(m.name)}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;border:3px solid var(--paper-line);">`
      : '';
    document.getElementById('dContent').innerHTML = `
      ${photoHtml}
      <p><b>Thế hệ:</b> Đời thứ ${ROMAN[m.generation] || m.generation}</p>
      <p><b>Giới tính:</b> ${m.gender === 'male' ? 'Nam' : 'Nữ'}</p>
      <p><b>Trạng thái:</b> ${isDeceased ? 'Đã khuất' : 'Còn sống'}</p>
      <p><b>Nghề nghiệp:</b> ${escapeHTML(m.occupation) || 'Chưa cập nhật'}</p>
      <p><b>Năm sinh - mất:</b> ${escapeHTML(m.dob) || '?'} - ${escapeHTML(m.dod) || 'Còn sống'}</p>
      <p><b>Vợ/Chồng:</b> ${escapeHTML(m.spouse) || 'Chưa cập nhật'}</p>
      <p><b>Ghi chú:</b> ${escapeHTML(m.note) || 'Không có'}</p>
    `;
    
    checkAuthUI(); 
    document.getElementById('detailModal').style.display = 'flex';
  }

  function closeDetail() { 
    document.getElementById('detailModal').style.display = 'none'; 
  }

  function editFromDetail() {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền sửa!"); return; }
    closeDetail(); 
    editingId = detailId;
    
    const m = members.find(x => x.id === detailId);
    if (!m) return;

    document.getElementById('modalTitle').textContent = 'Sửa thông tin';
    document.getElementById('mName').value = m.name || '';
    document.getElementById('mGender').value = m.gender || 'male';
    document.getElementById('mGeneration').value = m.generation || 1;
    document.getElementById('mDob').value = m.dob || '';
    document.getElementById('mDod').value = m.dod || '';
    document.getElementById('mSpouse').value = m.spouse || '';
    document.getElementById('mOccupation').value = m.occupation || '';
    document.getElementById('mNote').value = m.note || '';
    currentPhotoData = m.photo || '';
    updatePhotoPreview(currentPhotoData);
    
    updateParentSelect(m.id);
    document.getElementById('mParentId').value = m.parentId !== null ? m.parentId : '';
    document.getElementById('mParentId').onchange = handleParentChange;
    
    document.getElementById('btnDelete').style.display = 'inline-block';
    document.getElementById('memberModal').style.display = 'flex';
  }

  function addChildFromDetail() {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền thêm con!"); return; }
    const parentId = detailId;
    closeDetail(); 
    
    openAddModal();
    document.getElementById('mParentId').value = parentId;
    handleParentChange(); // Tự động tính đời cho con
  }

  // ==========================================
  // XUẤT / NHẬP FILE & TÍNH NĂNG KHÁC
  // ==========================================
  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ members, nextId }, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `gia_pha_data_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(input) {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền nhập file!"); return; }
    const file = input.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (data.members && Array.isArray(data.members)) {
          members = data.members;
          nextId = data.nextId || (Math.max(...members.map(m => m.id), 0) + 1);
          renderTree();
          saveData();
          alert('Nhập dữ liệu thành công!');
        } else {
          alert('File JSON không đúng cấu trúc gia phả!');
        }
      } catch (err) { 
        alert('File JSON không hợp lệ!'); 
      }
      input.value = ''; // Reset input file
    };
    reader.readAsText(file);
  }

  function clearAll() {
    if (!isAdmin()) return;
    if (confirm('CẢNH BÁO TỐI CAO: Bạn có chắc chắn muốn XÓA SẠCH toàn bộ dữ liệu cây gia phả?')) {
      members = [];
      nextId = 1;
      renderTree();
      saveData();
    }
  }

  function zoomTree(d) { 
    zoomLevel = Math.max(0.3, Math.min(2.0, zoomLevel + d)); // Giới hạn phóng to/thu nhỏ
    document.getElementById('zoomFit').style.transform = `scale(${zoomLevel})`; 
    document.getElementById('zoomLabel').textContent = `${Math.round(zoomLevel * 100)}%`;
  }

  // Lắng nghe sự kiện phím Esc để đóng các modal
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeDetail();
      closeLoginModal();
    }
  });

  // Chạy ứng dụng
  init();
</script>
