<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gia Phả Họ LƯỜNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="https://tse1.mm.bing.net/th/id/OIP.vuok9DjN2hsg1LX87ecG_AHaFL?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --paper: #efe5cf;
    --paper-deep: #e2d3a9;
    --paper-line: #d8c793;
    --ink: #241d17;
    --ink-soft: #6e6252;
    --lacquer: #7c1f2c;
    --lacquer-deep: #501019;
    --lacquer-tint: #f7e9ea;
    --gold: #ab8226;
    --gold-soft: #dcb455;
    --gold-tint: #f3e6c2;
    --indigo: #2c4a5e;
    --rose: #8f3349;
    --line: #b79a5e;
    --shadow: 0 10px 28px rgba(36,29,23,0.16);
    --font-display: 'Noto Serif', serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-tap-highlight-color: transparent; height:100%; }

  /* Bố cục cố định theo khung nhìn: tiêu đề + thanh công cụ + vùng cây (tự cuộn) */
  body{
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    display:flex; flex-direction:column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  header{
    position: relative; flex-shrink:0;
    background: linear-gradient(180deg, var(--lacquer) 0%, var(--lacquer-deep) 100%);
    color: var(--gold-tint);
    text-align: center;
    padding: 26px 16px 22px;
    padding-top: max(26px, calc(env(safe-area-inset-top) + 12px));
    border-bottom: 4px solid var(--gold);
    box-shadow: var(--shadow);
  }
  header h1{ font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 5vw, 30px);}

  .toolbar-wrap{
    position: relative; flex-shrink:0; z-index: 60;
    background: var(--paper-deep);
    border-bottom: 1px solid var(--paper-line);
    box-shadow: 0 4px 14px rgba(36,29,23,0.08);
  }
  .controls{
    display:flex; gap:8px; justify-content:center; align-items:center;
    flex-wrap: wrap; padding: 10px 12px; max-width: 1100px; margin: 0 auto;
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding: 9px 14px; border:1px solid transparent;
    border-radius: 999px; cursor:pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    white-space: nowrap; background: #fff; color: var(--ink);
  }
  .btn:active{ transform: scale(0.96); }
  .btn:focus-visible, .zoom-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn .ic{ font-size: 15px; line-height:1; }
  .btn-add{ background: var(--lacquer); color:#fff; }
  .btn-export{ background: var(--indigo); color:#fff; }
  .btn-import{ background: var(--gold); color:#fff; cursor: pointer; }
  input[type="file"]{ display:none; }
  .btn-fit{ background:#fff; color: var(--indigo); border-color: var(--indigo); }
  .btn-login{ background: var(--ink); color:#fff; }
  .btn-logout{ background:#7a2020; color:#fff; }

  .admin-only { display: none !important; }

  .sync-status{ text-align:center; font-family: var(--font-mono); font-size: 11px; padding: 0 12px 8px; min-height: 14px; color: var(--ink-soft); }
  .sync-status.syncing{ color: var(--gold); }
  .sync-status.ok{ color:#2e7d32; }
  .sync-status.error{ color:#b3261e; }

  .zoom-group{ display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--paper-line); border-radius: 999px; padding: 3px; }
  .zoom-btn{ width:30px; height:30px; border:none; border-radius:50%; background:transparent; font-size:16px; font-weight:700; cursor:pointer; }
  .zoom-label{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 42px; text-align:center; }

  .legend{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; padding: 4px 12px 8px; font-size: 12px; color: var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot.male{ background: var(--indigo); }
  .dot.female{ background: var(--rose); }
  .dot.living{ background: var(--gold); }
  .dot.deceased{ background: var(--ink-soft); }

  /* Vùng cây: tự cuộn, kéo bằng chuột, cuộn bằng ngón tay */
  .tree-area{
    flex: 1 1 auto; min-height: 0;
    padding: 34px 16px 70px; overflow: auto; text-align:center;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    cursor: grab; user-select: none; -webkit-user-select: none;
  }
  .tree-area.dragging{ cursor: grabbing; }
  .tree-area.dragging .node-card{ pointer-events: none; }
  /* Thu phóng bằng CSS zoom để vùng cuộn luôn khớp kích thước thật */
  .zoom-fit{ display:inline-block; text-align:center; }

  /* Organization Tree CSS */
  .tree ul{ padding-top: 26px; position: relative; width: max-content; }
  .tree > ul{ display:inline-block; padding-top:0; }
  .tree ul::after{ content:''; display:table; clear:both; }
  .tree li{ float:left; text-align:center; list-style:none; position:relative; padding: 26px 10px 0 10px; }
  .tree li::before, .tree li::after{ content:''; position:absolute; top:0; right:50%; border-top: 2px solid var(--line); width:50%; height:26px; }
  .tree li::after{ right:auto; left:50%; border-left: 2px solid var(--line); }
  .tree li:only-child::after, .tree li:only-child::before{ display:none; }
  .tree li:only-child{ padding-top:0; }
  .tree li:first-child::before, .tree li:last-child::after{ border:0 none; }
  .tree li:last-child::before{ border-right: 2px solid var(--line); border-radius: 0 6px 0 0; }
  .tree li:first-child::after{ border-radius: 6px 0 0 0; }
  .tree ul ul::before{ content:''; position:absolute; top:0; left:50%; border-left: 2px solid var(--line); width:0; height:26px; }

  .node-card{
    display:inline-block; background:#fffdf8; border: 1px solid var(--paper-line);
    border-top: none; border-radius: 4px 4px 12px 12px;
    padding: clamp(12px,3.2vw,20px) clamp(10px,3vw,16px) clamp(8px,2vw,14px);
    min-width: clamp(126px, 34vw, 180px); max-width: clamp(148px, 40vw, 210px);
    text-align:center; cursor:pointer; position:relative;
    box-shadow: 0 4px 12px rgba(36,29,23,0.10); transition: transform .16s ease;
  }
  .node-card:hover{ transform: translateY(-3px); }
  .node-card::before{
    content:''; position:absolute; top:-9px; left:50%; transform: translateX(-50%);
    border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 9px solid var(--gold);
  }
  .node-card.male{ border-top: 3px solid var(--indigo); }
  .node-card.male::before{ border-bottom-color: var(--indigo); }
  .node-card.female{ border-top: 3px solid var(--rose); }
  .node-card.female::before{ border-bottom-color: var(--rose); }

  .node-avatars-wrap{
    display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 auto 10px;
  }
  .node-avatar{
    width: clamp(40px, 11vw, 64px); height: clamp(40px, 11vw, 64px); border-radius: 50%; margin: 0 auto 8px;
    background-size: cover; background-position: center; background-color: var(--paper-deep);
    border: 2px solid var(--paper-line);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 4.2vw, 26px); color: var(--ink-soft); flex-shrink: 0;
  }
  .node-avatars-wrap .node-avatar{ margin: 0; }
  .node-card.male .node-avatar.member-avatar{ border-color: var(--indigo); }
  .node-card.female .node-avatar.member-avatar{ border-color: var(--rose); }
  .node-avatar.female-border{ border-color: var(--rose) !important; }
  .node-avatar.male-border{ border-color: var(--indigo) !important; }
  .avatar-heart{ font-size: 14px; color: var(--rose); font-weight: bold; }

  .node-eyebrow{ font-family: var(--font-mono); font-size: 10px; color: var(--gold); text-transform: uppercase; }
  .node-name{ font-family: var(--font-display); font-weight: 700; font-size: clamp(12.5px, 3.4vw, 15px); }
  .node-years, .node-spouse{ font-size: clamp(9.5px, 2.6vw, 11.5px); color: var(--ink-soft); margin-top: 4px; }
  .node-occupation{ font-size: clamp(9px, 2.4vw, 11px); color: var(--ink-soft); font-style: italic; margin-top: 3px; }
  .node-status{
    display:inline-flex; align-items:center; gap:4px;
    margin-top: 8px; font-size: 10px; font-weight:600;
    padding: 2px 8px; border-radius: 999px;
  }
  .node-status.living{ background: var(--gold-tint); color:#7a5c14; }
  .node-status.deceased{ background:#eceae4; color: var(--ink-soft); }
  .node-status .dot{ width:6px; height:6px; }

  /* ============ MODAL (CĂN GIỮA MÀN HÌNH MẶC ĐỊNH & MOBILE) ============ */
  .modal-overlay{
    display:none;
    position: fixed;
    inset:0;
    background: rgba(36,29,23,0.65);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    justify-content:center;
    align-items:center;
    z-index:100;
    padding: 16px;
  }
  .modal-box{
    background:#fffdf8;
    border-radius: 16px;
    width:100%;
    max-width: 440px;
    padding: 24px 20px;
    max-height: 88vh;
    max-height: 88dvh;
    overflow-y:auto;
    border-top: 5px solid var(--lacquer);
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    margin: auto;
  }
  .modal-box h2{
    font-family: var(--font-display);
    color: var(--lacquer);
    margin-bottom: 16px;
    font-size: 20px;
    text-align: center;
  }

  /* Định dạng chi tiết thông tin ở giữa màn hình */
  .detail-content{ margin-top: 10px; }
  .detail-info-group{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .detail-info-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: #fbf7ee;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    font-size: 13.5px;
  }
  .detail-info-row .label{ font-weight: 600; color: var(--ink-soft); }
  .detail-info-row .val{ font-weight: 600; color: var(--ink); text-align: right; }
  .detail-info-block{
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    background: #fbf7ee;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    font-size: 13.5px;
  }
  .detail-info-block .label{ font-weight: 600; color: var(--ink-soft); }
  .detail-info-block .val{ color: var(--ink); line-height: 1.4; }

  .form-group{ margin-bottom: 14px; }
  .form-group label{ display:block; font-size:12.5px; font-weight:600; color: var(--ink-soft); margin-bottom:5px; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea{ width:100%; padding: 10px 12px; border:1px solid var(--paper-line); border-radius: 8px; font-size:14px; font-family: inherit; background: #fbf7ee; }
  .form-row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .modal-note{ font-size:12px; color: var(--ink-soft); margin-bottom: 12px; text-align: center; }
  .error-text{ color: #b3261e; font-size: 12px; margin-bottom: 10px; text-align: center; }
  .btn-save{ background: var(--lacquer); color:#fff; }
  .btn-cancel{ background:#efe9db; color: var(--ink); }
  .btn-delete{ background:#fff; color:#b3261e; border:1px solid #b3261e; }

  .empty-state{ text-align:center; padding: 70px 20px; color: var(--ink-soft); }

  .photo-upload-row{ display:flex; align-items:center; gap:14px; }
  .photo-preview{
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    background-size:cover; background-position:center; background-color: var(--paper-deep);
    border:2px solid var(--paper-line);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; color: var(--ink-soft);
  }
  .photo-upload-actions{ display:flex; flex-direction:column; gap:6px; }
  .photo-upload-actions .btn{ padding:7px 12px; font-size:12px; }

  .detail-avatar{
    width: clamp(76px, 24vw, 110px); height: clamp(76px, 24vw, 110px);
    border-radius: 50%; object-fit: cover; border: 3px solid var(--paper-line);
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ============ RESPONSIVE ============ */

  /* Màn hình rất lớn */
  @media (min-width: 1400px){
    .controls{ max-width: 1300px; }
    .tree-area{ padding: 46px 40px 90px; }
    .node-card{ min-width: 200px; max-width: 230px; }
  }

  /* Tablet */
  @media (max-width: 900px){
    .controls{ gap:7px; padding: 9px 10px; }
    .legend{ gap:12px; }
  }

  /* Điện thoại chung */
  @media (max-width: 640px){
    header{ padding: 12px 12px 10px; padding-top: max(12px, calc(env(safe-area-inset-top) + 6px)); border-bottom-width: 3px; }
    header h1{ font-size: 18px; }

    /* Thanh công cụ cuộn ngang */
    .controls{
      flex-wrap: nowrap; overflow-x: auto; justify-content: safe center;
      gap:6px; padding: 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .controls::-webkit-scrollbar{ display:none; }
    .controls > *{ flex-shrink: 0; }
    .btn{ padding: 8px 12px; font-size: 12.5px; gap:5px; }
    .zoom-btn{ width:34px; height:34px; font-size:17px; }
    .zoom-label{ width:38px; font-size:10.5px; }
    .legend{ gap:10px; font-size: 10.5px; padding: 2px 8px 6px; }
    .sync-status{ padding-bottom: 6px; }

    .tree-area{ padding: 22px 8px 56px; }
    .tree li{ padding: 22px 6px 0 6px; }
    .node-status{ font-size: 9px; padding: 2px 7px; }

    /* Modal hiển thị ở CHÍNH GIỮA màn hình điện thoại */
    .modal-overlay{
      display:none;
      align-items: center !important;
      justify-content: center !important;
      padding: 16px !important;
    }
    .modal-box{
      max-width: 100% !important;
      width: 100% !important;
      max-height: 86vh !important;
      max-height: 86dvh !important;
      border-radius: 16px !important;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom)) !important;
      margin: auto !important;
    }
    .modal-box h2{ font-size: 18px; }
    .photo-preview{ width:54px; height:54px; font-size:22px; }
    /* 16px để iOS không tự phóng to khi nhập liệu */
    .form-group input, .form-group select, .form-group textarea{ font-size: 16px; }
  }

  /* Điện thoại nhỏ */
  @media (max-width: 480px){
    .btn .label{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .btn{ padding: 12px; border-radius: 50%; min-width:44px; min-height:44px; justify-content:center; }
    .btn .ic{ font-size: 16px; }

    .tree li{ padding: 20px 5px 0 5px; }
    .node-avatar{ border-width: 1.5px; }

    .form-row{ grid-template-columns: 1fr; gap: 0; }
    .form-row .form-group{ margin-bottom: 14px; }
    .photo-preview{ width:50px; height:50px; font-size:20px; }
    
    .modal-actions{ gap: 8px; }
    .modal-actions .btn{ border-radius: 999px; min-width: 0; min-height: 0; padding: 10px 16px; }
    .modal-actions .btn .label{ position:static; width:auto; height:auto; margin:0; clip:auto; }
  }

  @media (max-width: 360px){
    .btn{ padding: 11px; }
  }

  /* Điện thoại xoay ngang */
  @media (max-height: 480px) and (orientation: landscape){
    header{ display:none; }
    .legend{ display:none; }
    .modal-box{ max-height: 92vh !important; max-height: 92dvh !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Gia Phả Họ LƯỜNG</h1>
</header>

<div class="toolbar-wrap">
  <div class="controls">
    <button class="btn btn-add admin-only" onclick="openAddModal()"><span class="ic">➕</span><span class="label">Thêm tổ tiên</span></button>
    <button class="btn btn-export" onclick="exportData()"><span class="ic">💾</span><span class="label">Xuất file</span></button>
    <label class="btn btn-import admin-only">
      <span class="ic">📁</span><span class="label">Nhập file</span>
      <input type="file" id="fileInput" accept=".json" onchange="importData(this)">
    </label>

    <button class="btn btn-login" id="btnLogin" onclick="openLoginModal()"><span class="ic">🔑</span><span class="label">Đăng nhập</span></button>
    <button class="btn btn-logout admin-only" id="btnLogout" onclick="logout()"><span class="ic">🚪</span><span class="label">Đăng xuất</span></button>

    <button class="btn btn-fit" onclick="fitTree()" title="Thu phóng vừa khung hình và căn giữa"><span class="ic">🔳</span><span class="label">Vừa khung</span></button>
    <div class="zoom-group">
      <button class="zoom-btn" onclick="zoomTree(-0.1)" aria-label="Thu nhỏ">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="zoom-btn" onclick="zoomTree(0.1)" aria-label="Phóng to">+</button>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot male"></i>Nam</span>
    <span><i class="dot female"></i>Nữ</span>
    <span><i class="dot living"></i>Còn sống</span>
    <span><i class="dot deceased"></i>Đã khuất</span>
  </div>
  <div id="syncStatus" class="sync-status"></div>
</div>

<div class="tree-area" id="treeArea">
  <div class="zoom-fit" id="zoomFit">
    <div id="treeRoot" class="tree"></div>
  </div>
</div>

<!-- MODAL LOGIN ADMIN -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h2>Cấu hình Admin (GitHub Sync)</h2>
    <p class="modal-note">Nhập Personal Access Token GitHub của bạn để kích hoạt quyền.</p>
    <div class="form-group">
      <label>GitHub Personal Access Token</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>GitHub Owner</label>
        <input type="text" id="ghOwner" placeholder="...">
      </div>
      <div class="form-group">
        <label>GitHub Repository</label>
        <input type="text" id="ghRepo" placeholder="...">
      </div>
    </div>
    <p id="loginError" class="error-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeLoginModal()">Hủy</button>
      <button class="btn btn-save" onclick="loginAdmin()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- MODAL ADD/EDIT MEMBER -->
<div class="modal-overlay" id="memberModal">
  <div class="modal-box">
    <h2 id="modalTitle">Thêm thành viên</h2>
    <div class="form-group">
      <label>Họ và tên *</label>
      <input type="text" id="mName" placeholder="...">
    </div>
    <div class="form-group">
      <label>Ảnh đại diện</label>
      <div class="photo-upload-row">
        <div id="mPhotoPreview" class="photo-preview">👤</div>
        <div class="photo-upload-actions">
          <label class="btn btn-import" style="cursor:pointer;">
            <span class="ic">📷</span><span class="label">Chọn ảnh</span>
            <input type="file" id="mPhotoInput" accept="image/*" onchange="handlePhotoSelect(this)">
          </label>
          <button type="button" class="btn btn-cancel" id="btnRemovePhoto" onclick="removePhoto()" style="display:none;">Xóa ảnh</button>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Giới tính</label>
        <select id="mGender">
          <option value="male">Nam</option>
          <option value="female">Nữ</option>
        </select>
      </div>
      <div class="form-group">
        <label>Thế hệ thứ</label>
        <input type="number" id="mGeneration" placeholder="1" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Năm sinh</label>
        <input type="text" id="mDob" placeholder="...">
      </div>
      <div class="form-group">
        <label>Năm mất</label>
        <input type="text" id="mDod" placeholder="Để trống nếu còn sống">
      </div>
    </div>
    <div class="form-group">
      <label>Vợ / Chồng</label>
      <input type="text" id="mSpouse" placeholder="...">
    </div>
    <div class="form-group">
      <label>Ảnh đại diện Vợ / Chồng</label>
      <div class="photo-upload-row">
        <div id="mSpousePhotoPreview" class="photo-preview">👤</div>
        <div class="photo-upload-actions">
          <label class="btn btn-import" style="cursor:pointer;">
            <span class="ic">📷</span><span class="label">Chọn ảnh Vợ/Chồng</span>
            <input type="file" id="mSpousePhotoInput" accept="image/*" onchange="handleSpousePhotoSelect(this)">
          </label>
          <button type="button" class="btn btn-cancel" id="btnRemoveSpousePhoto" onclick="removeSpousePhoto()" style="display:none;">Xóa ảnh</button>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Nghề nghiệp</label>
      <input type="text" id="mOccupation" placeholder="...">
    </div>
    <div class="form-group">
      <label>Ghi chú</label>
      <textarea id="mNote" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Cha / Mẹ</label>
      <select id="mParentId"><option value="">-- Tổ tiên --</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn btn-delete admin-only" id="btnDelete" onclick="deleteMember()">Xóa</button>
      <button class="btn btn-save" onclick="saveMember()">Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL VIEW DETAIL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <h2 id="dName"></h2>
    <div id="dContent" class="detail-content"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeDetail()">Đóng</button>
      <button class="btn btn-add admin-only" onclick="editFromDetail()">Sửa</button>
      <button class="btn btn-add admin-only" onclick="addChildFromDetail()">Thêm con</button>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // KHỞI TẠO BIẾN CẤU HÌNH & TRẠNG THÁI
  // ==========================================
  let members = [];
  let nextId = 1;
  let editingId = null;
  let detailId = null;
  let zoomLevel = 1;
  let fileSha = null;
  let currentPhotoData = '';
  let currentSpousePhotoData = '';

  let ghConfig = null;
  try { ghConfig = JSON.parse(sessionStorage.getItem('ghAdminConfig')) || null; } catch (e) { ghConfig = null; }

  async function init() {
    enableDragPan();
    checkAuthUI();
    await loadData();
    renderTree();
    // Vừa khung tự động duy nhất 1 lần khi mở trang
    await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
    fitTree();
  }

  // ==========================================
  // XÁC THỰC VÀ PHÂN QUYỀN
  // ==========================================
  function checkAuthUI() {
    const loginBtn = document.getElementById('btnLogin');
    document.querySelectorAll('.admin-only').forEach(el => el.setAttribute('data-admin', '1'));

    document.querySelectorAll('[data-admin]').forEach(el => {
      el.classList.toggle('admin-only', !isAdmin());
    });
    if (loginBtn) loginBtn.style.display = isAdmin() ? 'none' : 'inline-flex';
  }

  function isAdmin() {
    return !!(ghConfig && ghConfig.token && ghConfig.owner && ghConfig.repo);
  }

  function openLoginModal() {
    document.getElementById('ghToken').value = ghConfig?.token || '';
    document.getElementById('ghOwner').value = ghConfig?.owner || '';
    document.getElementById('ghRepo').value = ghConfig?.repo || '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginModal').style.display = 'flex';
  }

  function closeLoginModal() {
    document.getElementById('loginModal').style.display = 'none';
  }

  function loginAdmin() {
    const token = document.getElementById('ghToken').value.trim();
    const owner = document.getElementById('ghOwner').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();

    if (!token || !owner || !repo) {
      document.getElementById('loginError').textContent = 'Vui lòng nhập đủ thông tin!';
      return;
    }

    ghConfig = { token, owner, repo };
    sessionStorage.setItem('ghAdminConfig', JSON.stringify(ghConfig));
    checkAuthUI();
    closeLoginModal();
    saveData();
  }

  function logout() {
    ghConfig = null;
    sessionStorage.removeItem('ghAdminConfig');
    checkAuthUI();
    renderTree();
    loadData().then(() => renderTree());
  }

  // ==========================================
  // ĐỒNG BỘ DỮ LIỆU
  // ==========================================
  function setSyncStatus(state, msg) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    if (state === 'syncing') { el.textContent = '🔄 ' + msg; el.className = 'sync-status syncing'; }
    else if (state === 'ok') { el.textContent = '✅ ' + msg; el.className = 'sync-status ok'; }
    else if (state === 'error') { el.textContent = '⚠️ ' + msg; el.className = 'sync-status error'; }
  }

  function utf8ToBase64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
  }

  async function loadData() {
    setSyncStatus('syncing', 'Đang tải dữ liệu...');

    const localTemp = localStorage.getItem('temp_family_data');
    if (localTemp) {
      try {
        const data = JSON.parse(localTemp);
        members = data.members || [];
        nextId = data.nextId || 1;
      } catch (e) { console.error('Cache error:', e); }
    }

    try {
      const res = await fetch(`data.json?t=${new Date().getTime()}`, { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        members = data.members || [];
        nextId = data.nextId || 1;
        localStorage.setItem('temp_family_data', JSON.stringify({ members, nextId }));
        setSyncStatus('ok', 'Đã tải dữ liệu mới nhất');
      } else {
        if (!localTemp) setSyncStatus('ok', 'Khởi tạo cây gia phả mới');
      }
    } catch (e) {
      if (localTemp) {
        setSyncStatus('ok', 'Đang hiển thị dữ liệu từ bộ nhớ tạm');
      } else {
        setSyncStatus('error', 'Không đọc được file data.json');
      }
    }
  }

  async function saveData() {
    if (!isAdmin()) {
      alert('Bạn không có quyền thực hiện thao tác này!');
      return;
    }
    setSyncStatus('syncing', 'Đang lưu vào GitHub...');
    localStorage.setItem('temp_family_data', JSON.stringify({ members, nextId }));

    try {
      const getUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/data.json`;

      const getRes = await fetch(getUrl, {
        headers: {
          'Authorization': `Bearer ${ghConfig.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (getRes.ok) {
        const fileInfo = await getRes.json();
        fileSha = fileInfo.sha;
      }

      const payload = JSON.stringify({ members, nextId }, null, 2);
      const contentBase64 = utf8ToBase64(payload);

      const putRes = await fetch(getUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${ghConfig.token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: 'Cập nhật gia phả từ Admin',
          content: contentBase64,
          sha: fileSha || undefined
        })
      });

      if (putRes.ok) {
        const resData = await putRes.json();
        fileSha = resData.content.sha;
        setSyncStatus('ok', 'Đã lưu thành công!');
      } else {
        const err = await putRes.json();
        throw new Error(err.message || 'Lỗi ghi đè file');
      }
    } catch (e) {
      setSyncStatus('error', 'Lỗi lưu dữ liệu: ' + e.message);
      alert('Lỗi lưu GitHub: ' + e.message);
    }
  }

  // ==========================================
  // RENDER CÂY GIA PHẢ
  // ==========================================
  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV', 'XXV'];

  function renderTree() {
    const root = document.getElementById('treeRoot');
    root.innerHTML = '';

    const roots = members.filter(m => m.parentId === null || m.parentId === undefined || m.parentId === "");

    if (roots.length === 0) {
      root.innerHTML = `<div class="empty-state"><p>Chưa có dữ liệu gia phả. Hãy "Thêm tổ tiên".</p></div>`;
      return;
    }

    const ul = document.createElement('ul');
    roots.forEach(r => ul.appendChild(buildNodeLi(r)));
    root.appendChild(ul);
  }

  function buildNodeLi(member) {
    const li = document.createElement('li');
    li.appendChild(buildCard(member));

    const children = members.filter(m => m.parentId === member.id);
    if (children.length > 0) {
      const childUl = document.createElement('ul');
      children.forEach(c => childUl.appendChild(buildNodeLi(c)));
      li.appendChild(childUl);
    }
    return li;
  }

  function buildCard(m) {
    const card = document.createElement('div');
    card.className = `node-card ${m.gender}`;
    card.onclick = () => openDetail(m.id);

    const genDisplay = ROMAN[m.generation] || m.generation;
    const isDeceased = !!(m.dod && String(m.dod).trim());
    const memberAvatarHtml = m.photo
      ? `<div class="node-avatar member-avatar" style="background-image:url('${m.photo}')"></div>`
      : `<div class="node-avatar member-avatar">👤</div>`;
    let avatarsHtml = memberAvatarHtml;
    if (m.spouse) {
      const spouseBorderClass = m.gender === 'male' ? 'female-border' : 'male-border';
      const spouseAvatarHtml = m.spousePhoto
        ? `<div class="node-avatar ${spouseBorderClass}" style="background-image:url('${m.spousePhoto}')"></div>`
        : `<div class="node-avatar ${spouseBorderClass}">👤</div>`;
      avatarsHtml = `<div class="node-avatars-wrap">${memberAvatarHtml}<span class="avatar-heart">♥</span>${spouseAvatarHtml}</div>`;
    }
    card.innerHTML = `
      ${avatarsHtml}
      <div class="node-eyebrow">Đời ${genDisplay}</div>
      <div class="node-name">${escapeHTML(m.name)}</div>
      <div class="node-years">${escapeHTML(m.dob || '?')} - ${escapeHTML(m.dod || 'nay')}</div>
      ${m.occupation ? `<div class="node-occupation">${escapeHTML(m.occupation)}</div>` : ''}
      ${m.spouse ? `<div class="node-spouse">♥ ${escapeHTML(m.spouse)}</div>` : ''}
      <div class="node-status ${isDeceased ? 'deceased' : 'living'}">
        <i class="dot ${isDeceased ? 'deceased' : 'living'}"></i>${isDeceased ? 'Đã khuất' : 'Còn sống'}
      </div>
    `;
    return card;
  }

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }

  // ==========================================
  // THU PHÓNG, VỪA KHUNG, KÉO CHUỘT
  // ==========================================
  function applyZoom(z, keepCenter = true) {
    const area = document.getElementById('treeArea');
    const el = document.getElementById('zoomFit');
    const old = zoomLevel || 1;
    const cx = (area.scrollLeft + area.clientWidth / 2) / old;
    const cy = (area.scrollTop + area.clientHeight / 2) / old;

    zoomLevel = Math.max(0.1, Math.min(2, Math.round(z * 100) / 100));
    el.style.zoom = zoomLevel;
    document.getElementById('zoomLabel').textContent = Math.round(zoomLevel * 100) + '%';

    if (keepCenter) {
      area.scrollLeft = cx * zoomLevel - area.clientWidth / 2;
      area.scrollTop = cy * zoomLevel - area.clientHeight / 2;
    }
  }

  function zoomTree(d) { applyZoom(zoomLevel + d); }

  function fitTree() {
    const area = document.getElementById('treeArea');
    const el = document.getElementById('zoomFit');
    const tree = document.getElementById('treeRoot');
    if (!area || !tree) return;

    el.style.zoom = 1;
    const w = tree.scrollWidth, h = tree.scrollHeight;
    if (!w || !h) return;
    const s = Math.min(1, (area.clientWidth - 32) / w, (area.clientHeight - 60) / h);
    applyZoom(s, false);
    area.scrollLeft = (area.scrollWidth - area.clientWidth) / 2;
    area.scrollTop = 0;
  }

  function enableDragPan() {
    const area = document.getElementById('treeArea');
    let down = false, moved = false, sx = 0, sy = 0, sl = 0, st = 0;

    area.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      down = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      sl = area.scrollLeft; st = area.scrollTop;
    });

    window.addEventListener('mousemove', e => {
      if (!down) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      area.classList.add('dragging');
      area.scrollLeft = sl - dx;
      area.scrollTop = st - dy;
      e.preventDefault();
    });

    window.addEventListener('mouseup', () => {
      down = false;
      area.classList.remove('dragging');
    });

    area.addEventListener('click', e => {
      if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);

    area.addEventListener('wheel', e => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      applyZoom(zoomLevel * (e.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });
  }

  // ==========================================
  // ẢNH ĐẠI DIỆN
  // ==========================================
  function resizeImageFile(file, onDone) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX_SIZE = 240;
        let { width, height } = img;
        if (width > height) {
          if (width > MAX_SIZE) { height = Math.round(height * (MAX_SIZE / width)); width = MAX_SIZE; }
        } else {
          if (height > MAX_SIZE) { width = Math.round(width * (MAX_SIZE / height)); height = MAX_SIZE; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        onDone(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setPreview(previewId, removeBtnId, dataUrl) {
    const el = document.getElementById(previewId);
    const removeBtn = document.getElementById(removeBtnId);
    if (dataUrl) {
      el.style.backgroundImage = `url(${dataUrl})`;
      el.textContent = '';
      removeBtn.style.display = 'inline-flex';
    } else {
      el.style.backgroundImage = '';
      el.textContent = '👤';
      removeBtn.style.display = 'none';
    }
  }

  function updatePhotoPreview(d) { setPreview('mPhotoPreview', 'btnRemovePhoto', d); }
  function updateSpousePhotoPreview(d) { setPreview('mSpousePhotoPreview', 'btnRemoveSpousePhoto', d); }

  function handlePhotoSelect(input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      alert('Vui lòng chọn một tệp hình ảnh.');
      input.value = '';
      return;
    }
    resizeImageFile(file, (dataUrl) => {
      currentPhotoData = dataUrl;
      updatePhotoPreview(dataUrl);
    });
    input.value = '';
  }

  function removePhoto() {
    currentPhotoData = '';
    updatePhotoPreview('');
  }

  function handleSpousePhotoSelect(input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      alert('Vui lòng chọn một tệp hình ảnh.');
      input.value = '';
      return;
    }
    resizeImageFile(file, (dataUrl) => {
      currentSpousePhotoData = dataUrl;
      updateSpousePhotoPreview(dataUrl);
    });
    input.value = '';
  }

  function removeSpousePhoto() {
    currentSpousePhotoData = '';
    updateSpousePhotoPreview('');
  }

  // ==========================================
  // THÊM / SỬA / XÓA THÀNH VIÊN
  // ==========================================
  function updateParentSelect(excludeId = null) {
    const select = document.getElementById('mParentId');
    select.innerHTML = '<option value="">-- Tổ tiên (Gốc) --</option>';
    members.forEach(m => {
      if (m.id !== excludeId) {
        select.innerHTML += `<option value="${m.id}">${escapeHTML(m.name)} (Đời ${m.generation})</option>`;
      }
    });
  }

  function handleParentChange() {
    const parentId = document.getElementById('mParentId').value;
    const genInput = document.getElementById('mGeneration');
    if (parentId) {
      const parent = members.find(m => m.id === parseInt(parentId));
      if (parent) genInput.value = (parseInt(parent.generation) || 1) + 1;
    } else if (!editingId) {
      genInput.value = 1;
    }
  }

  function openAddModal() {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền thực hiện!"); return; }
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Thêm thành viên';
    document.getElementById('mName').value = '';
    document.getElementById('mGender').value = 'male';
    document.getElementById('mGeneration').value = '1';
    document.getElementById('mDob').value = '';
    document.getElementById('mDod').value = '';
    document.getElementById('mSpouse').value = '';
    document.getElementById('mOccupation').value = '';
    document.getElementById('mNote').value = '';
    document.getElementById('btnDelete').style.display = 'none';
    currentPhotoData = '';
    updatePhotoPreview('');
    currentSpousePhotoData = '';
    updateSpousePhotoPreview('');

    updateParentSelect();
    document.getElementById('mParentId').onchange = handleParentChange;
    document.getElementById('memberModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('memberModal').style.display = 'none';
  }

  function saveMember() {
    if (!isAdmin()) return;

    const name = document.getElementById('mName').value.trim();
    if (!name) return alert('Vui lòng nhập Họ và tên!');

    const gender = document.getElementById('mGender').value;
    const generation = parseInt(document.getElementById('mGeneration').value) || 1;
    const dob = document.getElementById('mDob').value.trim();
    const dod = document.getElementById('mDod').value.trim();
    const spouse = document.getElementById('mSpouse').value.trim();
    const occupation = document.getElementById('mOccupation').value.trim();
    const note = document.getElementById('mNote').value.trim();
    const pVal = document.getElementById('mParentId').value;
    const parentId = pVal ? parseInt(pVal) : null;

    if (editingId) {
      let m = members.find(x => x.id === editingId);
      if (m) {
        Object.assign(m, { name, gender, generation, dob, dod, spouse, occupation, note, parentId, photo: currentPhotoData, spousePhoto: currentSpousePhotoData });
      }
    } else {
      members.push({
        id: nextId++,
        name, gender, generation, dob, dod, spouse, occupation, note, parentId, photo: currentPhotoData, spousePhoto: currentSpousePhotoData
      });
    }

    renderTree();
    closeModal();
    saveData();
  }

  function deleteMember() {
    if (!isAdmin()) return;
    if (!editingId || !confirm('CẢNH BÁO: Xóa người này sẽ xóa toàn bộ con cháu của họ. Bạn có chắc chắn?')) return;

    function removeBranch(id) {
      const kids = members.filter(m => m.parentId === id).map(m => m.id);
      members = members.filter(m => m.id !== id);
      kids.forEach(removeBranch);
    }

    removeBranch(editingId);
    renderTree();
    closeModal();
    saveData();
  }

  // ==========================================
  // CHI TIẾT (CĂN GIỮA MÀN HÌNH DI ĐỘNG)
  // ==========================================
  function openDetail(id) {
    detailId = id;
    const m = members.find(x => x.id === id);
    if (!m) return;

    document.getElementById('dName').textContent = m.name;
    const isDeceased = !!(m.dod && String(m.dod).trim());
    
    // Hình ảnh đại diện đôi hoặc đơn
    const coupleHtml = (m.photo || (m.spouse && m.spousePhoto)) ? `
      <div style="display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:16px;">
        ${m.photo ? `<img src="${m.photo}" alt="${escapeHTML(m.name)}" class="detail-avatar">` : ''}
        ${m.spouse && m.spousePhoto ? `<img src="${m.spousePhoto}" alt="${escapeHTML(m.spouse)}" class="detail-avatar">` : ''}
      </div>
    ` : '';

    // Trình bày thông tin dạng thẻ đẹp mắt
    document.getElementById('dContent').innerHTML = `
      ${coupleHtml}
      <div class="detail-info-group">
        <div class="detail-info-row">
          <span class="label">Thế hệ</span>
          <span class="val">Đời thứ ${ROMAN[m.generation] || m.generation}</span>
        </div>
        <div class="detail-info-row">
          <span class="label">Giới tính</span>
          <span class="val">${m.gender === 'male' ? 'Nam' : 'Nữ'}</span>
        </div>
        <div class="detail-info-row">
          <span class="label">Trạng thái</span>
          <span class="val">${isDeceased ? '🔴 Đã khuất' : '🟢 Còn sống'}</span>
        </div>
        <div class="detail-info-row">
          <span class="label">Năm sinh - mất</span>
          <span class="val">${escapeHTML(m.dob) || '?'} - ${escapeHTML(m.dod) || (isDeceased ? '?' : 'Nay')}</span>
        </div>
        ${m.spouse ? `
        <div class="detail-info-row">
          <span class="label">Vợ / Chồng</span>
          <span class="val">♥ ${escapeHTML(m.spouse)}</span>
        </div>` : ''}
        ${m.occupation ? `
        <div class="detail-info-row">
          <span class="label">Nghề nghiệp</span>
          <span class="val">${escapeHTML(m.occupation)}</span>
        </div>` : ''}
        ${m.note ? `
        <div class="detail-info-block">
          <span class="label">Ghi chú</span>
          <span class="val">${escapeHTML(m.note)}</span>
        </div>` : ''}
      </div>
    `;

    checkAuthUI();
    document.getElementById('detailModal').style.display = 'flex';
  }

  function closeDetail() {
    document.getElementById('detailModal').style.display = 'none';
  }

  function editFromDetail() {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền sửa!"); return; }
    closeDetail();
    editingId = detailId;

    const m = members.find(x => x.id === detailId);
    if (!m) return;

    document.getElementById('modalTitle').textContent = 'Sửa thông tin';
    document.getElementById('mName').value = m.name || '';
    document.getElementById('mGender').value = m.gender || 'male';
    document.getElementById('mGeneration').value = m.generation || 1;
    document.getElementById('mDob').value = m.dob || '';
    document.getElementById('mDod').value = m.dod || '';
    document.getElementById('mSpouse').value = m.spouse || '';
    document.getElementById('mOccupation').value = m.occupation || '';
    document.getElementById('mNote').value = m.note || '';
    currentPhotoData = m.photo || '';
    updatePhotoPreview(currentPhotoData);
    currentSpousePhotoData = m.spousePhoto || '';
    updateSpousePhotoPreview(currentSpousePhotoData);

    updateParentSelect(m.id);
    document.getElementById('mParentId').value = (m.parentId !== null && m.parentId !== undefined) ? m.parentId : '';
    document.getElementById('mParentId').onchange = handleParentChange;

    document.getElementById('btnDelete').style.display = 'inline-flex';
    document.getElementById('memberModal').style.display = 'flex';
  }

  function addChildFromDetail() {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền thêm con!"); return; }
    const parentId = detailId;
    closeDetail();

    openAddModal();
    document.getElementById('mParentId').value = parentId;
    handleParentChange();
  }

  // ==========================================
  // XUẤT / NHẬP FILE
  // ==========================================
  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ members, nextId }, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `gia_pha_data_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function importData(input) {
    if (!isAdmin()) { alert("Chỉ Admin mới có quyền nhập file!"); return; }
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const data = JSON.parse(e.target.result);
        if (data.members && Array.isArray(data.members)) {
          members = data.members;
          nextId = data.nextId || (Math.max(...members.map(m => m.id), 0) + 1);
          renderTree();
          saveData();
          alert('Nhập dữ liệu thành công!');
        } else {
          alert('File JSON không đúng cấu trúc gia phả!');
        }
      } catch (err) {
        alert('File JSON không hợp lệ!');
      }
      input.value = '';
    };
    reader.readAsText(file);
  }

  // Phím Esc đóng các hộp thoại
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeDetail();
      closeLoginModal();
    }
  });

  init();
</script>
</body>
</html>
